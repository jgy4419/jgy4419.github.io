backend:
  name: github
  repo: jgy4419/jgy4419.github.io
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

media_libraries:
  default:
    config:
      max_file_size: 5242880 # 5 MiB
      transformations:
        raster_image:
          format: webp
          quality: 85
          max_width: 2048
          max_height: 2048

publish_mode: simple

site_url: https://jgy4419.github.io
display_url: https://jgy4419.github.io
logo_url: /favicon.svg

locale: ko

collections:
  - name: blog
    label: 블로그 포스트
    label_singular: 포스트
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [pubDate, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 요약, name: description, widget: string }
      - { label: 비공개, name: draft, widget: boolean, default: false }
      - { label: 작성일, name: pubDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: 수정일, name: updatedDate, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, required: false }
      # 카테고리: 기존 포스트들의 category 값에서 자동완성
      - label: 카테고리
        name: category
        widget: relation
        collection: blog
        value_field: category
        search_fields: [category]
        display_fields: [category]
        multiple: false
        default: 개발
      # 태그: 기존 포스트들의 tags.* 에서 자동완성 (복수 선택)
      - label: 태그
        name: tags
        widget: relation
        collection: blog
        value_field: "tags.*"
        search_fields: ["tags.*"]
        display_fields: ["tags.*"]
        multiple: true
        required: false
        default: []
      - { label: 대표 이미지, name: heroImage, widget: image, required: false }
      - { label: 본문, name: body, widget: markdown }
